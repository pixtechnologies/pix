<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>πX Enterprise Command Center</title>
  <!-- Google Fonts - Inter for clean typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    /* ----------------------------------------------------
       PREMIUM COMMAND CENTER THEME & VARIABLES
       ---------------------------------------------------- */
    :root {
      --bg: #000000;
      --surface-primary: #0A0A0A;
      --surface-secondary: #111111;
      --surface-tertiary: #1A1A1A;
      --text-primary: #FFFFFF;
      --text-secondary: #A0A5AC;
      --text-muted: #666666;
      --accent: #C0C8D0; /* Titanium Silver */
      --accent-muted: #4A4F54;
      --border: rgba(255, 255, 255, 0.08);
      --border-bright: rgba(255, 255, 255, 0.18);
      
      --success: #10B981;
      --success-bg: rgba(16, 185, 129, 0.05);
      --warning: #F59E0B;
      --warning-bg: rgba(245, 158, 11, 0.05);
      --error: #EF4444;
      --error-bg: rgba(239, 68, 68, 0.05);
      
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sidebar-width: 240px;
      --sidebar-collapsed-width: 68px;
      --topbar-height: 56px;
      --ease-custom: cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Reset & Base Styles */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    input, button, select, textarea {
      font-family: inherit;
      color: inherit;
      background: none;
      border: none;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--surface-tertiary);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-muted);
    }

    /* ----------------------------------------------------
       LAYOUT STRUCTURING
       ---------------------------------------------------- */
    .app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar Styles */
    .sidebar {
      width: var(--sidebar-width);
      background-color: var(--bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: flex-col;
      flex-shrink: 0;
      height: 100%;
      transition: width 0.4s var(--ease-custom);
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .sidebar.collapsed {
      width: var(--sidebar-collapsed-width);
    }

    .sidebar-header {
      height: var(--topbar-height);
      display: flex;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      justify-content: space-between;
      overflow: hidden;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .logo-text {
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.5px;
      color: var(--text-primary);
      transition: opacity 0.3s var(--ease-custom);
    }

    .sidebar.collapsed .logo-text {
      opacity: 0;
      pointer-events: none;
    }

    .sidebar-toggle-btn {
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      transition: all 0.2s ease;
    }
    .sidebar-toggle-btn:hover {
      color: var(--text-primary);
      background-color: var(--surface-tertiary);
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 16px 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .nav-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      padding: 0 20px;
      margin-bottom: 6px;
      font-weight: 700;
      white-space: nowrap;
      transition: opacity 0.3s var(--ease-custom);
    }

    .sidebar.collapsed .nav-section-title {
      opacity: 0;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      color: var(--text-secondary);
      font-weight: 500;
      cursor: pointer;
      border-left: 2px solid transparent;
      transition: all 0.2s var(--ease-custom);
      position: relative;
    }

    .nav-item:hover {
      color: var(--text-primary);
      background-color: rgba(255, 255, 255, 0.02);
    }

    .nav-item.active {
      color: var(--text-primary);
      background-color: rgba(255, 255, 255, 0.05);
      border-left-color: var(--text-primary);
    }

    .nav-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-label {
      transition: opacity 0.3s var(--ease-custom);
      white-space: nowrap;
    }

    .sidebar.collapsed .nav-label {
      opacity: 0;
      pointer-events: none;
    }

    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
      white-space: nowrap;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .avatar-wrapper {
      position: relative;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--surface-tertiary);
      border: 1px solid var(--border-bright);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 12px;
      flex-shrink: 0;
    }

    .online-dot {
      width: 8px;
      height: 8px;
      background-color: var(--success);
      border-radius: 50%;
      position: absolute;
      bottom: 0;
      right: 0;
      border: 1.5px solid var(--bg);
    }

    .user-info {
      display: flex;
      flex-direction: column;
      transition: opacity 0.3s var(--ease-custom);
    }

    .sidebar.collapsed .user-info {
      opacity: 0;
      pointer-events: none;
    }

    .user-name {
      font-weight: 600;
      font-size: 13px;
    }

    .user-role {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Main Content Area */
    .main-wrapper {
      display: flex;
      flex-direction: column;
      flex: 1;
      height: 100%;
      background-color: var(--bg);
      overflow: hidden;
    }

    /* Top Bar Styles */
    .topbar {
      height: var(--topbar-height);
      background-color: var(--surface-primary);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 13px;
    }

    .breadcrumb-current {
      color: var(--text-primary);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Command Palette Button */
    .cmd-palette-trigger {
      display: flex;
      align-items: center;
      gap: 12px;
      background-color: var(--surface-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px;
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
      width: 280px;
      transition: all 0.2s var(--ease-custom);
    }

    .cmd-palette-trigger:hover {
      border-color: var(--border-bright);
      color: var(--text-secondary);
    }

    .kbd-shortcut {
      background-color: var(--surface-tertiary);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--text-secondary);
      margin-left: auto;
    }

    .topbar-icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background-color: var(--surface-secondary);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      cursor: pointer;
      position: relative;
      transition: all 0.2s var(--ease-custom);
    }

    .topbar-icon-btn:hover {
      border-color: var(--border-bright);
      color: var(--text-primary);
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background-color: var(--accent);
      border-radius: 50%;
      position: absolute;
      top: 8px;
      right: 8px;
    }

    /* Dynamic Content Container */
    .content-container {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      position: relative;
    }

    /* ----------------------------------------------------
       GLOBAL COMPONENTS & CARDS
       ---------------------------------------------------- */
    .card {
      background-color: var(--surface-primary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      transition: transform 0.3s var(--ease-custom), border-color 0.3s var(--ease-custom);
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--border-bright);
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Stat Tiles */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background-color: var(--surface-primary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .stat-val-container {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .stat-value {
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 700;
    }

    .stat-change {
      font-size: 11px;
      font-family: var(--font-mono);
    }

    .stat-change.up {
      color: var(--success);
    }
    .stat-change.down {
      color: var(--error);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s var(--ease-custom);
    }

    .btn-primary {
      background-color: var(--accent);
      color: var(--bg);
    }
    .btn-primary:hover {
      background-color: var(--text-primary);
    }

    .btn-secondary {
      background-color: var(--surface-secondary);
      border: 1px solid var(--border);
      color: var(--text-primary);
    }
    .btn-secondary:hover {
      border-color: var(--border-bright);
      background-color: var(--surface-tertiary);
    }

    .btn-danger {
      background-color: var(--error-bg);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: var(--error);
    }
    .btn-danger:hover {
      background-color: var(--error);
      color: var(--text-primary);
    }

    .btn-sm {
      padding: 4px 10px;
      font-size: 11px;
      border-radius: 6px;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 4px;
      font-family: var(--font-mono);
    }

    .badge-success {
      background-color: var(--success-bg);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.15);
    }

    .badge-warning {
      background-color: var(--warning-bg);
      color: var(--warning);
      border: 1px solid rgba(245, 158, 11, 0.15);
    }

    .badge-error {
      background-color: var(--error-bg);
      color: var(--error);
      border: 1px solid rgba(239, 68, 68, 0.15);
    }

    .badge-secondary {
      background-color: var(--surface-tertiary);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    /* ----------------------------------------------------
       TABS FADE TRANSITION STYLES
       ---------------------------------------------------- */
    .tab-content {
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s var(--ease-custom), transform 0.3s var(--ease-custom);
      display: none;
    }

    .tab-content.active-tab {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    /* ----------------------------------------------------
       OVERVIEW TAB LAYOUT
       ---------------------------------------------------- */
    .overview-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    .overview-main {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .overview-sidebar {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Intelligence Score & State Card */
    .intel-score-card {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .gauge-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      flex-shrink: 0;
    }

    .circular-gauge {
      transform: rotate(-90deg);
    }

    .gauge-bg {
      stroke: var(--surface-tertiary);
    }

    .gauge-fg {
      stroke: var(--accent);
      stroke-dasharray: 251.2;
      stroke-dashoffset: 251.2;
      animation: progress-draw 1.5s var(--ease-custom) forwards;
    }

    @keyframes progress-draw {
      to {
        stroke-dashoffset: 15.08; /* (251.2 - (251.2 * 94/100)) */
      }
    }

    .gauge-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .gauge-score {
      font-family: var(--font-mono);
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
    }

    .gauge-max {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .state-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .state-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .state-badge-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
      animation: pulse-green 2s infinite;
    }

    @keyframes pulse-green {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 6px rgba(16, 185, 129, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }

    .state-metrics {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .state-metric-item {
      display: flex;
      flex-direction: column;
      background-color: var(--surface-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
    }

    .state-metric-label {
      color: var(--text-muted);
    }
    .state-metric-value {
      font-weight: 600;
      color: var(--text-secondary);
    }

    /* Active Reasoning */
    .reasoning-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .reasoning-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .reasoning-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }

    .reasoning-name {
      font-weight: 500;
    }

    .reasoning-percent {
      font-family: var(--font-mono);
      color: var(--text-secondary);
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background-color: var(--surface-secondary);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fg {
      height: 100%;
      background-color: var(--accent);
      border-radius: 3px;
      width: 0%;
      transition: width 0.4s ease;
    }

    /* Dynamic Intelligence Stream */
    .intel-stream-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 250px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .stream-item {
      display: flex;
      gap: 12px;
      font-family: var(--font-mono);
      font-size: 11px;
      padding-bottom: 10px;
      border-bottom: 1px dashed var(--border);
      opacity: 0;
      transform: translateY(-5s);
      animation: stream-fade-in 0.3s forwards ease;
    }

    @keyframes stream-fade-in {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .stream-time {
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .stream-text {
      color: var(--text-secondary);
    }

    .stream-tag {
      color: var(--accent);
      font-weight: 600;
    }

    /* Active Decisions */
    .active-decisions-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .decision-card {
      background-color: var(--surface-primary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.3s var(--ease-custom);
    }

    .decision-card:hover {
      border-color: var(--border-bright);
    }

    .decision-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .decision-id {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 12px;
      color: var(--accent);
    }

    .decision-confidence {
      font-family: var(--font-mono);
      font-size: 11px;
      background-color: var(--surface-tertiary);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .decision-desc {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .decision-impact {
      font-size: 11px;
      color: var(--text-muted);
    }

    .decision-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    /* ----------------------------------------------------
       MEMORY TAB
       ---------------------------------------------------- */
    .memory-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .memory-left {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .memory-right {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .search-box-container {
      display: flex;
      gap: 10px;
    }

    .input-field {
      flex: 1;
      background-color: var(--surface-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text-primary);
      font-size: 13px;
      transition: all 0.2s var(--ease-custom);
    }

    .input-field:focus {
      outline: none;
      border-color: var(--accent);
      background-color: var(--surface-secondary);
    }

    .memory-clusters-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cluster-item {
      background-color: var(--surface-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cluster-item:hover {
      border-color: var(--border-bright);
      background-color: var(--surface-tertiary);
    }

    .cluster-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .cluster-name {
      font-weight: 600;
      font-size: 13px;
    }

    .cluster-details {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      gap: 12px;
    }

    .cluster-size {
      font-family: var(--font-mono);
    }

    .cluster-nodes-count {
      font-family: var(--font-mono);
    }

    /* Ingest Drag Zone */
    .upload-zone {
      border: 2px dashed var(--border);
      background-color: var(--surface-primary);
      border-radius: 12px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s var(--ease-custom);
    }

    .upload-zone:hover, .upload-zone.dragover {
      border-color: var(--accent);
      background-color: var(--surface-secondary);
    }

    .upload-icon {
      color: var(--text-muted);
    }

    .upload-zone:hover .upload-icon {
      color: var(--accent);
    }

    .upload-title {
      font-weight: 600;
      font-size: 14px;
    }

    .upload-subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }

    .storage-bar-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background-color: var(--surface-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .storage-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }

    .storage-percentage {
      font-family: var(--font-mono);
      font-weight: bold;
    }

    .storage-bar-blocks {
      display: flex;
      gap: 3px;
    }

    .storage-block {
      flex: 1;
      height: 12px;
      background-color: var(--surface-tertiary);
      border-radius: 1px;
    }

    .storage-block.filled {
      background-color: var(--accent);
    }

    /* ----------------------------------------------------
       KNOWLEDGE TAB
       ---------------------------------------------------- */
    .knowledge-layout {
      display: grid;
      grid-template-columns: 2.2fr 1fr;
      gap: 20px;
      height: calc(100vh - var(--topbar-height) - 72px);
    }

    .knowledge-graph-container {
      background-color: var(--surface-primary);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .graph-node {
      cursor: pointer;
      transition: all 0.3s var(--ease-custom);
    }

    .graph-node circle {
      stroke: var(--bg);
      stroke-width: 2px;
      transition: fill 0.3s ease, stroke-width 0.3s ease;
    }

    .graph-node:hover circle {
      stroke-width: 4px;
      stroke: var(--text-primary);
    }

    .graph-node.selected circle {
      fill: var(--text-primary) !important;
      stroke: var(--accent) !important;
      stroke-width: 5px;
    }

    .graph-edge {
      stroke: var(--border);
      stroke-width: 1.5;
      transition: stroke 0.3s ease, stroke-width 0.3s ease;
    }

    .graph-edge.highlighted {
      stroke: var(--accent);
      stroke-width: 2.5;
    }

    .graph-labels text {
      font-size: 11px;
      font-weight: 500;
      fill: var(--text-secondary);
      pointer-events: none;
      user-select: none;
    }

    .knowledge-side-panel {
      background-color: var(--surface-primary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .panel-section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .meta-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 13px;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      padding-bottom: 8px;
    }

    .meta-key {
      color: var(--text-muted);
    }

    .meta-val {
      font-family: var(--font-mono);
      font-size: 12px;
      text-align: right;
    }

    /* ----------------------------------------------------
       AI ASSISTANT TAB
       ---------------------------------------------------- */
    .ai-assistant-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      height: calc(100vh - var(--topbar-height) - 72px);
    }

    .chat-container {
      background-color: var(--surface-primary);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background-color: var(--surface-secondary);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-header-title {
      font-weight: 600;
      font-size: 13px;
    }

    .chat-scroller {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .message {
      display: flex;
      gap: 16px;
      max-width: 85%;
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message.system {
      align-self: flex-start;
    }

    .msg-avatar {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .message.user .msg-avatar {
      background-color: var(--text-primary);
      color: var(--bg);
    }

    .message.system .msg-avatar {
      background-color: var(--surface-tertiary);
      border: 1px solid var(--border-bright);
      color: var(--accent);
    }

    .msg-body-wrapper {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .msg-sender {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .message.user .msg-sender {
      text-align: right;
    }

    .msg-bubble {
      background-color: var(--surface-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13px;
      line-height: 1.6;
    }

    .message.user .msg-bubble {
      background-color: var(--surface-tertiary);
      border-color: rgba(255, 255, 255, 0.15);
    }

    /* Reasoning block styling inside AI responses */
    .thought-block {
      background-color: rgba(255, 255, 255, 0.02);
      border-left: 2px solid var(--accent);
      padding: 8px 12px;
      margin-bottom: 12px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      border-radius: 0 6px 6px 0;
    }

    .citation {
      display: inline-flex;
      align-items: center;
      background-color: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 4px;
      font-size: 10px;
      font-family: var(--font-mono);
      font-weight: 600;
      color: var(--accent);
      cursor: pointer;
      margin-left: 4px;
      transition: background-color 0.2s ease;
    }

    .citation:hover {
      background-color: rgba(255, 255, 255, 0.15);
      color: var(--text-primary);
    }

    .typing-indicator {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
    }

    .typing-dot {
      width: 4px;
      height: 4px;
      background-color: var(--text-secondary);
      border-radius: 50%;
      animation: typing-bounce 1s infinite ease-in-out;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .chat-input-bar {
      border-top: 1px solid var(--border);
      padding: 14px 20px;
      background-color: var(--surface-secondary);
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .chat-input {
      flex: 1;
      font-size: 13px;
      padding: 8px 0;
      color: var(--text-primary);
    }

    .chat-input:focus {
      outline: none;
    }

    .chat-side-panel {
      background-color: var(--surface-primary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .context-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .context-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: var(--surface-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
    }

    .context-checkbox {
      appearance: none;
      width: 14px;
      height: 14px;
      border: 1px solid var(--border-bright);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
      background-color: var(--bg);
    }

    .context-checkbox:checked {
      background-color: var(--accent);
      border-color: var(--accent);
    }

    .context-checkbox:checked::after {
      content: '';
      position: absolute;
      width: 8px;
      height: 4px;
      border-left: 1.5px solid var(--bg);
      border-bottom: 1.5px solid var(--bg);
      transform: rotate(-45deg);
      top: 3px;
      left: 2px;
    }

    /* ----------------------------------------------------
       AGENTS TAB
       ---------------------------------------------------- */
    .agents-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .agent-card {
      background-color: var(--surface-primary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: all 0.3s var(--ease-custom);
    }

    .agent-card:hover {
      border-color: var(--border-bright);
      transform: translateY(-2px);
    }

    .agent-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .agent-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .agent-avatar {
      width: 40px;
      height: 40px;
      background-color: var(--surface-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .agent-title-block {
      display: flex;
      flex-direction: column;
    }

    .agent-name {
      font-weight: 700;
      font-size: 14px;
    }

    .agent-version {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
    }

    .agent-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .agent-stat-item {
      display: flex;
      flex-direction: column;
      background-color: var(--surface-secondary);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
    }

    .agent-stat-label {
      color: var(--text-muted);
    }

    .agent-stat-val {
      font-weight: 700;
      color: var(--text-secondary);
    }

    .agent-terminal {
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      height: 80px;
      overflow-y: auto;
    }

    .agent-terminal-line {
      margin-bottom: 4px;
    }

    .agent-terminal-time {
      color: var(--text-muted);
      margin-right: 6px;
    }

    .agent-terminal-text {
      color: var(--text-secondary);
    }

    /* ----------------------------------------------------
       DOCUMENTS TAB (TABLE LAYOUT)
       ---------------------------------------------------- */
    .docs-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 16px;
    }

    .table-container {
      background-color: var(--surface-primary);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow-x: auto;
    }

    .enterprise-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }

    .enterprise-table th {
      background-color: var(--surface-secondary);
      border-bottom: 1px solid var(--border);
      color: var(--text-secondary);
      font-weight: 600;
      padding: 12px 20px;
      font-size: 12px;
    }

    .enterprise-table td {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .enterprise-table tr:last-child td {
      border-bottom: none;
    }

    .enterprise-table tr:hover td {
      background-color: rgba(255, 255, 255, 0.01);
      color: var(--text-primary);
    }

    .doc-name-cell {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 500;
      color: var(--text-primary);
    }

    /* ----------------------------------------------------
       DECISIONS LEDGER
       ---------------------------------------------------- */
    .decisions-ledger-layout {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ----------------------------------------------------
       SIMULATION TAB (MONTE CARLO)
       ---------------------------------------------------- */
    .simulation-layout {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
    }

    .sim-config-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .config-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .config-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 500;
    }

    .range-slider {
      width: 100%;
      accent-color: var(--accent);
      background-color: var(--surface-tertiary);
      height: 4px;
      border-radius: 2px;
      cursor: pointer;
    }

    .selector-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .selector-btn {
      background-color: var(--surface-secondary);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      font-size: 12px;
      text-align: center;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .selector-btn:hover {
      border-color: var(--border-bright);
    }

    .selector-btn.active {
      background-color: rgba(255,255,255,0.05);
      border-color: var(--text-primary);
      color: var(--text-primary);
    }

    .sim-results-card {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .simulation-chart-wrapper {
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* ----------------------------------------------------
       ANALYTICS TAB
       ---------------------------------------------------- */
    .analytics-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .analytics-chart-card {
      height: 320px;
      display: flex;
      flex-direction: column;
    }

    .chart-container-inner {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
    }

    .svg-chart-tooltip {
      position: absolute;
      background-color: var(--surface-secondary);
      border: 1px solid var(--border-bright);
      padding: 8px 12px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-primary);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 100;
    }

    /* ----------------------------------------------------
       INTEGRATIONS GRID
       ---------------------------------------------------- */
    .integrations-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .integration-card {
      background-color: var(--surface-primary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.3s var(--ease-custom);
    }

    .integration-card:hover {
      border-color: var(--border-bright);
      transform: translateY(-2px);
    }

    .integration-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .integration-logo {
      width: 32px;
      height: 32px;
      background-color: var(--surface-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .integration-name {
      font-weight: 700;
      font-size: 14px;
    }

    .integration-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* ----------------------------------------------------
       SETTINGS FORM
       ---------------------------------------------------- */
    .settings-layout {
      display: grid;
      grid-template-columns: 1fr 2.5fr;
      gap: 24px;
    }

    .settings-nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .settings-nav-item {
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .settings-nav-item:hover {
      background-color: var(--surface-secondary);
      color: var(--text-primary);
    }

    .settings-nav-item.active {
      background-color: var(--surface-tertiary);
      color: var(--text-primary);
    }

    .settings-form-panel {
      background-color: var(--surface-primary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .settings-group-title {
      font-size: 15px;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 8px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      padding-bottom: 14px;
    }

    .setting-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 80%;
    }

    .setting-label {
      font-weight: 600;
      font-size: 13px;
    }

    .setting-desc {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--surface-tertiary);
      transition: .3s var(--ease-custom);
      border-radius: 34px;
      border: 1px solid var(--border);
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: var(--text-muted);
      transition: .3s var(--ease-custom);
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--text-primary);
      border-color: var(--text-primary);
    }

    input:checked + .slider:before {
      transform: translateX(18px);
      background-color: var(--bg);
    }

    /* ----------------------------------------------------
       COMMAND PALETTE (⌘K) MODAL OVERLAY
       ---------------------------------------------------- */
    .cmd-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding-top: 10vh;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .cmd-overlay.active {
      display: flex;
      opacity: 1;
    }

    .cmd-palette {
      width: 600px;
      background-color: var(--surface-primary);
      border: 1px solid var(--border-bright);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.5);
      transform: translateY(-20px);
      transition: transform 0.25s var(--ease-custom);
    }

    .cmd-overlay.active .cmd-palette {
      transform: translateY(0);
    }

    .cmd-search-wrapper {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cmd-search-input {
      flex: 1;
      font-size: 15px;
      color: var(--text-primary);
    }

    .cmd-search-input::placeholder {
      color: var(--text-muted);
    }

    .cmd-search-input:focus {
      outline: none;
    }

    .cmd-results-scroller {
      max-height: 380px;
      overflow-y: auto;
      padding: 12px;
    }

    .cmd-group {
      margin-bottom: 16px;
    }

    .cmd-group-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 0 8px;
      margin-bottom: 6px;
    }

    .cmd-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-secondary);
      transition: all 0.1s ease;
    }

    .cmd-item:hover, .cmd-item.selected {
      background-color: var(--surface-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .cmd-item-icon {
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cmd-item:hover .cmd-item-icon, .cmd-item.selected .cmd-item-icon {
      color: var(--text-primary);
    }

    .cmd-item-label {
      flex: 1;
    }

    .cmd-item-shortcut {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
    }

    .cmd-footer {
      background-color: var(--surface-secondary);
      border-top: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      justify-content: flex-end;
      gap: 16px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .cmd-legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .cmd-legend-key {

       TOAST NOTIFICATION SYSTEM
       ---------------------------------------------------- */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 2000;
      pointer-events: none;
    }

    .toast {
      background-color: var(--surface-primary);
      border: 1px solid var(--border-bright);
      border-radius: 10px;
      padding: 12px 18px;
      width: 320px;
      box-shadow: 0 16px 32px rgba(0,0,0,0.4);
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transform: translateY(20px);
      opacity: 0;
      pointer-events: auto;
      transition: all 0.3s var(--ease-custom);
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast-icon {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }

    .toast-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
    }

    .toast-title {
      font-weight: 600;
      font-size: 13px;
    }

    .toast-desc {
      font-size: 11px;
      color: var(--text-muted);
    }

    .toast-close {
      cursor: pointer;
      color: var(--text-muted);
      transition: color 0.15s ease;
    }

    .toast-close:hover {
      color: var(--text-primary);
    }

    /* Accessibility preference */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {

          appendAgentLine(t2, agentMockLines[2][i]);
        }
      }

      // Live updates
      const runInterval = (id, container) => {
        return setInterval(() => {
          const list = agentMockLines[id];
          const text = list[Math.floor(Math.random() * list.length)];
          appendAgentLine(container, text);
        }, 3000 + Math.random() * 2000);
      };

      if (t1) agentLogIntervals.push(runInterval(1, t1));
      if (t2) agentLogIntervals.push(runInterval(2, t2));
    }

    function appendAgentLine(terminal, text) {
      if (!terminal) return;
      const d = new Date();
      const timeStr = d.toTimeString().split(' ')[0];
      const div = document.createElement('div');
      div.className = 'agent-terminal-line';
      div.innerHTML = `
        <span class="agent-terminal-time">[${timeStr}]</span>
        <span class="agent-terminal-text">${text}</span>
      `;
      terminal.appendChild(div);
      terminal.scrollTop = terminal.scrollHeight;

      if (terminal.children.length > 20) {
        terminal.removeChild(terminal.firstChild);
      }
    }

    // ----------------------------------------------------
    // DOCUMENTS TABLE RENDER & FILTER
    // ----------------------------------------------------
    function renderDocumentsTable() {
      const tbody = document.getElementById('documents-table-body');
      if (!tbody) return;

      tbody.innerHTML = AppState.documents.map(doc => `
        <tr>
          <td>
            <div class="doc-name-cell">

    function filterDocumentsTable() {
      const q = document.getElementById('doc-filter').value.toLowerCase();

    // ----------------------------------------------------
    // MONTE CARLO SIMULATION INTERFACE
    // ----------------------------------------------------
    function drawDistributionCurve() {
      // Standard static representation of bell curve or redraw values
      const path = document.getElementById('distribution-curve-path');
      const shade = document.getElementById('risk-shading-path');
      const varLine = document.getElementById('var-limit-line');
      if (!path) return;

      // Smooth default state path mapping
      path.setAttribute('d', 'M 50 198 Q 150 195 200 120 T 300 40 T 400 120 T 550 198');
      shade.setAttribute('d', 'M 50 198 Q 150 195 160 160 L 160 200 L 50 200');
    }

    function runSimulation() {
      if (AppState.monteCarloRunning) return;
      
      const loader = document.getElementById('sim-running-indicator');
      const loaderMsg = document.getElementById('sim-loader-msg');
      const runBtn = document.getElementById('run-sim-button');
      
      if (loader) loader.style.display = 'flex';
      if (runBtn) runBtn.disabled = true;
      AppState.monteCarloRunning = true;

      const trials = parseInt(document.getElementById('trials-slider').value);
      const volatility = parseInt(document.getElementById('vol-slider').value);

      // Simulation phases loader logs
      setTimeout(() => { loaderMsg.textContent = 'Mapping input matrices...'; }, 600);
      setTimeout(() => { loaderMsg.textContent = `Processing ${trials.toLocaleString()} trials...`; }, 1200);
      setTimeout(() => { loaderMsg.textContent = 'Consolidating Value-at-Risk limits...'; }, 1800);

      setTimeout(() => {
        if (loader) loader.style.display = 'none';
        if (runBtn) runBtn.disabled = false;
        AppState.monteCarloRunning = false;

        // Apply dynamic calculation adjustments
        const baseEV = 142.1 * (1 + (Math.random() * 0.1 - 0.05));
        const worstCaseVal = -48.2 * (volatility / 15);
        const bestCaseVal = 384.0 * (volatility / 15);

        // Update stats
        document.getElementById('sim-stat-ev').textContent = `$${baseEV.toFixed(1)}k`;
        document.getElementById('sim-stat-var').textContent = `-$${Math.abs(worstCaseVal).toFixed(1)}k`;
        document.getElementById('sim-stat-best').textContent = `+$${bestCaseVal.toFixed(1)}k`;

        // Slight adjustment path animation
        const peakHeight = 40 + Math.floor(Math.random() * 40 - 20);
        const path = document.getElementById('distribution-curve-path');
        const shade = document.getElementById('risk-shading-path');
        if (path) {
          path.setAttribute('d', `M 50 198 Q 150 195 200 140 T 300 ${peakHeight} T 400 140 T 550 198`);
          shade.setAttribute('d', `M 50 198 Q 150 195 160 165 L 160 200 L 50 200`);
        }

        showToast('Monte Carlo Success', `Evaluated ${trials.toLocaleString()} matrix states. VaR locked.`, 'success');
      }, 2400);
    }

    function setConfidenceBoundary(percentage) {
      document.querySelectorAll('.selector-btn').forEach(btn => {
        if (btn.id === `conf-${percentage}`) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      showToast('Confidence Limit Set', `Risk threshold boundaries updated to ${percentage}%.`, 'info');
    }

    // ----------------------------------------------------
    // ANALYTICS TOOLTIP INTERACTION
    // ----------------------------------------------------
    function showChartTooltip(e, text) {
      const tooltip = document.getElementById('analytics-tooltip');
      if (!tooltip) return;
      tooltip.style.opacity = '1';
      tooltip.innerHTML = text;
      tooltip.style.left = (e.clientX - tooltip.offsetParent.getBoundingClientRect().left - 100) + 'px';
      tooltip.style.top = (e.clientY - tooltip.offsetParent.getBoundingClientRect().top - 50) + 'px';
    }

    function hideChartTooltip() {
      const tooltip = document.getElementById('analytics-tooltip');
      if (tooltip) tooltip.style.opacity = '0';
    }

    // ----------------------------------------------------
    // INTEGRATION MANAGEMENT
    // ----------------------------------------------------
    function toggleIntegration(service) {
      showToast('Integration Requested', `Initiating OAuth validation path for ${service}...`, 'info');
    }

    // ----------------------------------------------------
    // SETTINGS CATEGORIES & ACTIONS
    // ----------------------------------------------------
    function switchSettingsPanel(panelId) {
      const form = document.getElementById('settings-dynamic-form');
      if (!form) return;

      document.querySelectorAll('.settings-nav-item').forEach(item => {
        if (item.getAttribute('onclick').includes(panelId)) {
          item.classList.add('active');
        } else {
          item.classList.remove('active');
        }
      });

      if (panelId === 'security') {
        form.innerHTML = `
          <div class="settings-group-title">Security & Encryption Settings</div>
          <div class="setting-row">
            <div class="setting-info">
              <span class="setting-label">AES-256 Vector Encryption</span>
              <span class="setting-desc">Enforce high-grade solid cryptographic storage validation for all vectors.</span>
            </div>
            <label class="switch">
              <input type="checkbox" checked onchange="handleSettingToggle('Vector Encryption', this.checked)">
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-row">
            <div class="setting-info">
              <span class="setting-label">IP Whitelist Enforcement</span>
              <span class="setting-desc">Only accept cluster-management requests from certified internal nodes.</span>
            </div>
            <label class="switch">
              <input type="checkbox" onchange="handleSettingToggle('IP Whitelist', this.checked)">
              <span class="slider"></span>
            </label>
          </div>
        `;
      } else if (panelId === 'compliance') {
        form.innerHTML = `
          <div class="settings-group-title">Compliance Automation</div>
          <div class="setting-row">
            <div class="setting-info">
              <span class="setting-label">GDPR Automated Purge Pathways</span>
              <span class="setting-desc">Identify and destroy expired vectors representing EU customer records.</span>
            </div>
            <label class="switch">
              <input type="checkbox" checked onchange="handleSettingToggle('GDPR Purging', this.checked)">
              <span class="slider"></span>
            </label>
          </div>
        `;
      } else if (panelId === 'api-keys') {
        form.innerHTML = `
          <div class="settings-group-title">API Gateway Token</div>
          <p style="font-size:12px; color:var(--text-secondary); margin-bottom:12px;">
            Enables model orchestration access keys to interface with external automation pipelines.
          </p>
          <div style="background-color:var(--surface-secondary); border:1px solid var(--border); border-radius:6px; padding:12px; font-family:var(--font-mono); font-size:12px; display:flex; justify-content:space-between; align-items:center;">
            <span id="api-key-text">pix_live_xxxxxxxxxxxxxxxxxxxx</span>
            <button class="btn btn-secondary btn-sm" onclick="generateApiKey()">Generate Key</button>
          </div>
        `;
      }
    }

    function handleSettingToggle(settingName, checked) {
      showToast('Settings Updated', `${settingName} toggled ${checked ? 'ON' : 'OFF'}.`, 'success');
    }

    function generateApiKey() {
      const container = document.getElementById('api-key-text');
      const key = `pix_live_${Math.random().toString(36).substring(2, 15)}${Math.random().toString(36).substring(2, 15)}`;
      if (container) container.textContent = key;
      showToast('API Key Generated', 'Created a secure access token credentials credentials.', 'success');
    }

    // ----------------------------------------------------
    // COMMAND PALETTE ENGINE (⌘K)
    // ----------------------------------------------------
    function toggleCmdPalette(open) {
      const overlay = document.getElementById('cmd-palette-overlay');
      const input = document.getElementById('cmd-search-input');
      
      AppState.commandPaletteOpen = open;
      if (open) {
        overlay.classList.add('active');
        input.value = '';
        input.focus();
        AppState.selectedCmdIndex = 0;
        filterCommands();
      } else {
        overlay.classList.remove('active');
      }
    }

    function handleOverlayClick(e) {
      if (e.target.id === 'cmd-palette-overlay') {
        toggleCmdPalette(false);
      }
    }

    function filterCommands() {
      const q = document.getElementById('cmd-search-input').value.toLowerCase();
      const list = document.getElementById('cmd-results-list');
      if (!list) return;

      const filtered = AppState.commandRegistry.filter(cmd => 
        cmd.label.toLowerCase().includes(q) || cmd.category.toLowerCase().includes(q)
      );

      if (filtered.length === 0) {
        list.innerHTML = `<div style="text-align:center; color:var(--text-muted); font-size:12px; padding:20px;">No matches found</div>`;
        return;
      }

      // Group commands
      const groups = {};
      filtered.forEach(cmd => {
        if (!groups[cmd.category]) groups[cmd.category] = [];
        groups[cmd.category].push(cmd);
      });

      let html = '';
      let globalIndex = 0;
      for (const cat in groups) {
        html += `<div class="cmd-group"><div class="cmd-group-title">${cat}</div>`;
        groups[cat].forEach(cmd => {
          const isSelected = globalIndex === AppState.selectedCmdIndex;
          html += `
            <div class="cmd-item ${isSelected ? 'selected' : ''}" data-cmd-index="${globalIndex}" onclick="triggerCommandByIndex(${globalIndex})">
              <div class="cmd-item-icon">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
              </div>
              <span class="cmd-item-label">${cmd.label}</span>
              ${cmd.shortcut ? `<kbd class="cmd-item-shortcut">${cmd.shortcut}</kbd>` : ''}
            </div>
          `;
          globalIndex++;
        });
        html += `</div>`;
      }

      list.innerHTML = html;
      AppState.maxCmdIndex = globalIndex - 1;
    }

    function navigateCommandSelection(dir) {
      let newIdx = AppState.selectedCmdIndex + dir;
      if (newIdx < 0) newIdx = AppState.maxCmdIndex;
      if (newIdx > AppState.maxCmdIndex) newIdx = 0;
      
      AppState.selectedCmdIndex = newIdx;
      filterCommands();

      // Scroll into view if needed
      const activeEl = document.querySelector('.cmd-item.selected');
      if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
    }

    function triggerSelectedCommand() {
      const q = document.getElementById('cmd-search-input').value.toLowerCase();
      const filtered = AppState.commandRegistry.filter(cmd => 
        cmd.label.toLowerCase().includes(q) || cmd.category.toLowerCase().includes(q)
      );
      if (filtered[AppState.selectedCmdIndex]) {
        filtered[AppState.selectedCmdIndex].action();
      }
    }

    function triggerCommandByIndex(idx) {
      AppState.selectedCmdIndex = idx;
      triggerSelectedCommand();
    }

    // ----------------------------------------------------
    // MODERN SYSTEM TOAST STACK
    // ----------------------------------------------------
    function showToast(title, desc, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const toastId = `toast-${Date.now()}`;
      
      let iconColor = 'var(--text-secondary)';
      let svgIcon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`;

      if (type === 'success') {
        iconColor = 'var(--success)';
        svgIcon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
      } else if (type === 'warning') {
        iconColor = 'var(--warning)';
        svgIcon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>`;
      } else if (type === 'error') {
        iconColor = 'var(--error)';
        svgIcon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`;
      }

      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.id = toastId;
      toast.innerHTML = `
        <div class="toast-icon" style="color:${iconColor};">${svgIcon}</div>
        <div class="toast-details">
          <span class="toast-title">${title}</span>
          <span class="toast-desc">${desc}</span>
        </div>
        <div class="toast-close" onclick="closeToast('${toastId}')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </div>
      `;

      container.appendChild(toast);

      // Force Reflow
      setTimeout(() => {
        toast.classList.add('show');
      }, 50);

      // Automatic dismiss
      setTimeout(() => {
        closeToast(toastId);
      }, 4000);
    }

    function closeToast(id) {
      const toast = document.getElementById(id);
      if (toast) {
        toast.classList.remove('show');
        toast.style.transform = 'translateY(10px)';
        toast.style.opacity = '0';
        setTimeout(() => {
          if (toast.parentNode) {
            toast.parentNode.removeChild(toast);
          }
        }, 300);
      }
    }
  </script>
