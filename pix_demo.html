<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>πX Enterprise Demo Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000;--surface:#0A0A0A;--surface-2:#111111;--surface-3:#1A1A1A;
  --text:#FFFFFF;--text-2:#A0A5AC;--text-3:#666666;
  --accent:#C0C8D0;--accent-2:#4A4F54;
  --border:rgba(255,255,255,0.08);--border-bright:rgba(255,255,255,0.18);
  --success:#10B981;--warning:#F59E0B;--error:#EF4444;
  --font:'Inter',-apple-system,sans-serif;--mono:'JetBrains Mono',monospace;
  --ease:cubic-bezier(0.16,1,0.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--accent-2)}
.app{display:flex;height:100vh;width:100vw}
.sidebar{width:240px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:width .3s var(--ease)}
.sidebar-brand{padding:20px 24px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.sidebar-brand .logo{width:32px;height:32px;border:1px solid var(--border-bright);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--accent);background:var(--surface-2)}
.sidebar-brand .name{font-size:14px;font-weight:600;letter-spacing:-0.3px}
.sidebar-brand .sub{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:1px}
.sidebar-nav{flex:1;padding:12px 8px;overflow-y:auto}
.nav-step{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:all .2s var(--ease);position:relative;margin-bottom:2px}
.nav-step:hover{background:var(--surface-2)}
.nav-step.active{background:var(--surface-3);color:var(--text)}
.nav-step.completed{color:var(--text-2)}
.nav-step.completed .nav-num{background:var(--success);color:#000;border-color:var(--success)}
.nav-step .nav-num{width:24px;height:24px;border:1px solid var(--border-bright);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;transition:all .2s var(--ease)}
.nav-step.active .nav-num{background:var(--accent);color:#000;border-color:var(--accent)}
.nav-step .nav-label{font-size:13px;font-weight:500;flex:1}
.nav-step .nav-check{font-size:10px;color:var(--success);opacity:0;transition:opacity .2s}
.nav-step.completed .nav-check{opacity:1}
.sidebar-footer{padding:16px;border-top:1px solid var(--border);font-size:11px;color:var(--text-3);display:flex;justify-content:space-between}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:56px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.topbar-left{display:flex;align-items:center;gap:16px}
.topbar-title{font-size:15px;font-weight:600}
.topbar-sub{font-size:12px;color:var(--text-3)}
.topbar-right{display:flex;align-items:center;gap:12px}
.org-badge{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;font-size:12px}
.org-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--success)}
.content{flex:1;overflow-y:auto;padding:32px 40px}
.step-panel{display:none;animation:fadeIn .4s var(--ease)}
.step-panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.step-header{margin-bottom:32px}
.step-header h1{font-size:24px;font-weight:700;letter-spacing:-0.5px;margin-bottom:6px}
.step-header p{font-size:14px;color:var(--text-2);max-width:600px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:640px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group.full{grid-column:1/-1}
.form-group label{font-size:12px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:0.5px}
.form-group input,.form-group select,.form-group textarea{padding:12px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;font-size:14px;color:var(--text);transition:border-color .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--accent)}
.form-group textarea{min-height:80px;resize:vertical;font-family:var(--font)}
.industry-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;max-width:700px;margin-bottom:24px}
.industry-card{padding:16px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:all .2s var(--ease);position:relative;overflow:hidden}
.industry-card:hover{border-color:var(--border-bright);background:var(--surface-3)}
.industry-card.selected{border-color:var(--accent);background:var(--surface-3)}
.industry-card.selected::after{content:'';position:absolute;top:8px;right:8px;width:16px;height:16px;background:var(--accent);border-radius:50%}
.industry-card .ic-icon{font-size:22px;margin-bottom:8px;color:var(--accent)}
.industry-card .ic-name{font-size:13px;font-weight:600}
.industry-card .ic-desc{font-size:11px;color:var(--text-3);margin-top:4px}
.upload-zone{border:2px dashed var(--border-bright);border-radius:12px;padding:48px;text-align:center;cursor:pointer;transition:all .2s var(--ease);max-width:600px;background:var(--surface-2)}
.upload-zone:hover{border-color:var(--accent);background:var(--surface-3)}
.upload-zone.dragover{border-color:var(--accent);background:var(--surface-3)}
.upload-zone .uz-icon{font-size:32px;color:var(--accent);margin-bottom:12px}
.upload-zone .uz-title{font-size:15px;font-weight:600;margin-bottom:4px}
.upload-zone .uz-sub{font-size:12px;color:var(--text-3)}
.upload-zone .uz-formats{margin-top:8px;font-size:11px;color:var(--text-3);font-family:var(--mono)}
.file-list{margin-top:16px;max-width:600px}
.file-item{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.file-item .fi-icon{width:32px;height:32px;border-radius:6px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--accent);flex-shrink:0}
.file-item .fi-info{flex:1}
.file-item .fi-name{font-size:13px;font-weight:500}
.file-item .fi-meta{font-size:11px;color:var(--text-3)}
.file-item .fi-size{font-size:11px;color:var(--text-3);font-family:var(--mono)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s var(--ease);border:1px solid transparent}
.btn-primary{background:var(--accent);color:#000}
.btn-primary:hover{opacity:0.9;transform:translateY(-1px)}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.btn-secondary{background:var(--surface-2);color:var(--text);border-color:var(--border)}
.btn-secondary:hover{background:var(--surface-3);border-color:var(--border-bright)}
.btn-ghost{background:none;color:var(--text-2)}
.btn-ghost:hover{color:var(--text)}
.step-actions{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:20px;border-top:1px solid var(--border)}
.analysis-container{max-width:640px}
.analysis-stage{display:flex;align-items:center;gap:14px;padding:16px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;transition:all .3s var(--ease)}
.analysis-stage.active{border-color:var(--accent);background:var(--surface-3)}
.analysis-stage.done{border-color:rgba(16,185,129,0.3);background:rgba(16,185,129,0.03)}
.analysis-stage .as-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;border:1px solid var(--border)}
.analysis-stage.active .as-icon{border-color:var(--accent);color:var(--accent)}
.analysis-stage.done .as-icon{border-color:var(--success);color:var(--success);background:rgba(16,185,129,0.05)}
.analysis-stage .as-content{flex:1}
.analysis-stage .as-title{font-size:13px;font-weight:600}
.analysis-stage .as-sub{font-size:11px;color:var(--text-3);margin-top:2px}
.analysis-stage .as-spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
.analysis-stage.done .as-spinner{display:none}
.analysis-stage .as-check{color:var(--success);font-size:16px;display:none}
.analysis-stage.done .as-check{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:700px;margin-bottom:24px}
.profile-section{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:20px}
.profile-section h3{font-size:12px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.entity-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;background:var(--surface-3);border:1px solid var(--border);border-radius:6px;font-size:12px;margin:0 4px 4px 0}
.entity-chip .ec-type{font-size:9px;color:var(--text-3);text-transform:uppercase;font-family:var(--mono)}
.kpi-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.kpi-row:last-child{border-bottom:none}
.kpi-row .kr-name{font-size:13px;font-weight:500}
.kpi-row .kr-formula{font-size:11px;color:var(--text-3);font-family:var(--mono)}
.kpi-row .kr-target{font-size:11px;color:var(--accent);font-family:var(--mono)}
.dash-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.dash-widget{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:20px;min-height:160px;position:relative;overflow:hidden}
.dash-widget.span-2{grid-column:span 2}
.dash-widget .dw-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.dash-widget .dw-title{font-size:12px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:0.5px}
.dash-widget .dw-type{font-size:10px;padding:2px 8px;background:var(--surface-3);border-radius:4px;color:var(--text-3);font-family:var(--mono)}
.dash-widget .dw-value{font-size:28px;font-weight:700;letter-spacing:-0.5px}
.dash-widget .dw-change{font-size:12px;margin-top:4px}
.dash-widget .dw-change.up{color:var(--success)}
.dash-widget .dw-change.down{color:var(--error)}
.dash-widget .dw-chart{margin-top:12px;height:40px;display:flex;align-items:end;gap:3px}
.dash-widget .dw-bar{flex:1;background:var(--accent-2);border-radius:2px;min-height:4px;transition:height .3s var(--ease)}
.dash-widget .dw-bar.active{background:var(--accent)}
.agent-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:700px}
.agent-card{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:18px;transition:all .3s var(--ease);cursor:pointer}
.agent-card.active{border-color:var(--accent);background:var(--surface-3)}
.agent-card .ag-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.agent-card .ag-icon{width:40px;height:40px;border-radius:10px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--accent);border:1px solid var(--border)}
.agent-card.active .ag-icon{border-color:var(--accent);background:rgba(192,200,208,0.05)}
.agent-card .ag-name{font-size:14px;font-weight:600}
.agent-card .ag-type{font-size:11px;color:var(--text-3)}
.agent-card .ag-purpose{font-size:12px;color:var(--text-2);line-height:1.4;margin-bottom:10px}
.agent-card .ag-kpis{display:flex;flex-wrap:wrap;gap:4px}
.agent-card .ag-kpi{font-size:10px;padding:3px 8px;background:var(--surface-3);border-radius:4px;color:var(--text-3);font-family:var(--mono)}
.agent-card .ag-status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-3);margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.agent-card.active .ag-status{color:var(--success)}
.agent-card .ag-dot{width:6px;height:6px;border-radius:50%;background:var(--text-3)}
.agent-card.active .ag-dot{background:var(--success);box-shadow:0 0 8px rgba(16,185,129,0.4)}
.chat-container{display:flex;flex-direction:column;max-width:720px;height:calc(100vh - 200px)}
.chat-messages{flex:1;overflow-y:auto;padding:4px 0}
.chat-msg{margin-bottom:16px}
.chat-msg.user{display:flex;justify-content:flex-end}
.chat-msg .msg-bubble{max-width:80%;padding:14px 18px;border-radius:14px;font-size:14px;line-height:1.5;white-space:pre-wrap}
.chat-msg.user .msg-bubble{background:var(--accent);color:#000;border-bottom-right-radius:4px}
.chat-msg.agent .msg-bubble{background:var(--surface-2);border:1px solid var(--border);border-bottom-left-radius:4px}
.chat-msg .msg-meta{font-size:10px;color:var(--text-3);margin-top:4px;margin-left:4px}
.chat-msg .msg-bubble .msg-decision{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.chat-msg .msg-bubble .msg-decision-title{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:4px}
.chat-msg .msg-bubble .msg-confidence{font-size:11px;color:var(--text-3);font-family:var(--mono)}
.chat-suggestions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chat-suggestion{padding:8px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--text-2);cursor:pointer;transition:all .2s}
.chat-suggestion:hover{border-color:var(--accent);color:var(--text)}
.chat-input{display:flex;gap:10px;padding:14px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px}
.chat-input input{flex:1;background:none;border:none;font-size:14px;color:var(--text);outline:none}
.chat-input input::placeholder{color:var(--text-3)}
.chat-input .send-btn{width:36px;height:36px;border-radius:8px;background:var(--accent);border:none;color:#000;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:16px}
.chat-input .send-btn:disabled{opacity:0.4;cursor:not-allowed}
.chat-typing{display:flex;align-items:center;gap:4px;padding:4px 0}
.chat-typing span{width:6px;height:6px;border-radius:50%;background:var(--text-3);animation:typing 1s infinite}
.chat-typing span:nth-child(2){animation-delay:0.2s}
.chat-typing span:nth-child(3){animation-delay:0.4s}
@keyframes typing{0%,60%,100%{opacity:0.3}30%{opacity:1}}
.intent-analysis{background:var(--surface-3);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px}
.intent-analysis .ia-label{font-size:10px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.intent-analysis .ia-tags{display:flex;flex-wrap:wrap;gap:6px}
.intent-tag{padding:3px 8px;background:var(--surface-2);border-radius:4px;font-size:11px;color:var(--text-2)}
.intent-tag.accent{background:rgba(192,200,208,0.1);color:var(--accent);border:1px solid var(--border-bright)}
.confidence-bar{width:100%;height:4px;background:var(--surface-3);border-radius:2px;overflow:hidden;margin-top:8px}
.confidence-bar .cb-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .5s var(--ease)}
.demo-complete{text-align:center;max-width:500px;margin:40px auto;padding:32px;background:var(--surface-2);border:1px solid var(--border);border-radius:16px}
.demo-complete .dc-icon{width:64px;height:64px;border:2px solid var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--accent);margin:0 auto 20px}
.demo-complete h2{font-size:20px;font-weight:700;margin-bottom:8px}
.demo-complete p{color:var(--text-2);font-size:13px;margin-bottom:24px}
.demo-complete .dc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.demo-complete .dc-stat{background:var(--surface-3);border:1px solid var(--border);border-radius:10px;padding:16px}
.demo-complete .dc-stat .ds-value{font-size:22px;font-weight:700;color:var(--accent)}
.demo-complete .dc-stat .ds-label{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px}
@media(max-width:900px){.sidebar{display:none}.form-grid{grid-template-columns:1fr}.profile-grid{grid-template-columns:1fr}.dash-grid{grid-template-columns:1fr}.agent-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="sidebar-brand"><div class="logo">πX</div><div><div class="name">πX Enterprise</div><div class="sub">Demo Flow</div></div></div>
<nav class="sidebar-nav" id="nav"></nav>
<div class="sidebar-footer"><span>v3.6 Demo</span><span id="orgName">—</span></div>
</aside>
<div class="main">
<div class="topbar">
<div class="topbar-left"><div class="topbar-title" id="topbarTitle">Onboarding</div><div class="topbar-sub" id="topbarSub">Step 1 of 6</div></div>
<div class="topbar-right">
<div class="org-badge" id="orgBadge" style="display:none"><div class="dot"></div><span id="orgBadgeName">—</span></div>
<button class="btn btn-ghost" onclick="resetDemo()">Reset</button>
</div>
</div>
<div class="content" id="content"></div>
</div>
</div>
<script>
const state={step:0,org:{name:'',industry:'',employees:'',description:''},dataset:{files:[],uploaded:false},profile:null,dashboard:null,agents:[],chatHistory:[]};
const STEPS=[{id:0,label:'Onboarding',desc:'Company setup'},{id:1,label:'Data Upload',desc:'Upload dataset'},{id:2,label:'Intelligence Profile',desc:'Auto-analysis'},{id:3,label:'Dashboard',desc:'Generated view'},{id:4,label:'AI Agents',desc:'Agent activation'},{id:5,label:'Intelligence',desc:'NL decision'}];
const INDUSTRIES=[{id:'retail',icon:'🛒',name:'Retail',desc:'Stores, merchandising, e-commerce'},{id:'manufacturing',icon:'⚙️',name:'Manufacturing',desc:'Discrete & process production'},{id:'finance',icon:'💰',name:'Finance',desc:'Banking, insurance, fintech'},{id:'healthcare',icon:'🏥',name:'Healthcare',desc:'Hospitals, pharma, devices'},{id:'logistics',icon:'🚢',name:'Logistics',desc:'Shipping, warehousing, supply chain'},{id:'saas',icon:'☁️',name:'SaaS',desc:'Software, platforms, subscriptions'},{id:'construction',icon:'🏗️',name:'Construction',desc:'Projects, contractors, materials'}];
const PROFILES={
retail:{entities:[{type:'Store',props:'store_id, name, region'},{type:'Product',props:'sku, name, category, price'},{type:'Customer',props:'customer_id, name, loyalty_tier'},{type:'Promotion',props:'promo_id, type, discount'},{type:'Transaction',props:'transaction_id, amount, date'}],kpis:[{name:'Revenue',formula:'SUM(net_rev)',target:'€1M/mo'},{name:'Gross Margin',formula:'revenue - cogs',target:'40%'},{name:'Sell-out Rate',formula:'units_sold / units_available',target:'80%'},{name:'Inventory Turnover',formula:'COGS / avg_inventory',target:'12x/yr'},{name:'Customer Churn',formula:'churned / total',target:'< 5%'},{name:'Avg Basket Size',formula:'revenue / transactions',target:'€45'}],agents:[{type:'sales',label:'Sales Agent',purpose:'Revenue analysis, sell-out monitoring, customer behavior',kpis:['Revenue','Sell-out Rate','Basket Size'],icon:'📈'},{type:'inventory',label:'Inventory Agent',purpose:'Stock levels, replenishment, supply chain optimization',kpis:['Inventory Turnover'],icon:'📦'},{type:'customer',label:'Customer Agent',purpose:'Churn prediction, loyalty analysis, segmentation',kpis:['Customer Churn'],icon:'👥'},{type:'finance',label:'Finance Agent',purpose:'Margin analysis, cost tracking, financial forecasting',kpis:['Revenue','Gross Margin'],icon:'💼'},{type:'marketing',label:'Marketing Agent',purpose:'Campaign ROI, promotion effectiveness, conversion analysis',kpis:['Revenue'],icon:'🎯'},{type:'strategy',label:'Strategy Agent',purpose:'Strategic planning, market positioning, growth opportunities',kpis:['Revenue','Margin'],icon:'♟️'}]},

function genSparkData(b,v,n){let d=[],x=b;for(let i=0;i<n;i++){x+=(Math.random()-0.5)*v;d.push(Math.max(0,Math.round(x)))}return d}
function renderNav(){const n=document.getElementById('nav');n.innerHTML=STEPS.map((s,i)=>'<div class="nav-step '+(i===state.step?'active':'')+' '+(i<state.step?'completed':'')+'" onclick="goToStep('+i+')"><div class="nav-num">'+(i<state.step?'':i+1)+'</div><div class="nav-label">'+s.label+'</div><div class="nav-check">✓</div></div>').join('');document.getElementById('topbarTitle').textContent=STEPS[state.step].label;document.getElementById('topbarSub').textContent='Step '+(state.step+1)+' of '+STEPS.length+' — '+STEPS[state.step].desc}
function goToStep(i){if(i<=state.step){state.step=i;renderStep()}}
function renderStep(){renderNav();const c=document.getElementById('content');const panels=[renderOnboarding,renderUpload,renderAnalysis,renderDashboard,renderAgents,renderChat];c.innerHTML=panels[state.step]();if(state.step===0)attachOnboarding();if(state.step===1)attachUpload();if(state.step===2)runAnalysis();if(state.step===4)attachAgents();if(state.step===5)attachChat()}
function renderOnboarding(){return '<div class="step-panel active"><div class="step-header"><h1>Welcome to πX Enterprise</h1><p>Tell us about your organization. πX will use this to build your intelligence profile, generate dashboards, and activate AI agents.</p></div><div class="form-grid" style="margin-bottom:24px"><div class="form-group"><label>Company Name</label><input type="text" id="orgNameInput" placeholder="Acme Corporation" value="'+(state.org.name||'')+'"></div><div class="form-group"><label>Employees</label><select id="orgSize"><option value="">Select size…</option><option value="1-50">1-50</option><option value="51-200">51-200</option><option value="201-1000">201-1000</option><option value="1000+">1000+</option></select></div><div class="form-group full"><label>What does your company do?</label><textarea id="orgDesc" placeholder="Brief description of your business…">'+(state.org.description||'')+'</textarea></div></div><div style="margin-bottom:16px"><label style="font-size:12px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:10px">Industry</label><div class="industry-grid" id="industryGrid">'+INDUSTRIES.map(function(ind){return '<div class="industry-card '+(state.org.industry===ind.id?'selected':'')+'" onclick="selectIndustry(\''+ind.id+'\')"><div class="ic-icon">'+ind.icon+'</div><div class="ic-name">'+ind.name+'</div><div class="ic-desc">'+ind.desc+'</div></div>'}).join('')+'</div></div><div class="step-actions"><span></span><button class="btn btn-primary" id="onboardingNext" onclick="completeOnboarding()" disabled>Continue →</button></div></div>'}
function attachOnboarding(){var n=document.getElementById('orgNameInput'),s=document.getElementById('orgSize'),d=document.getElementById('orgDesc'),b=document.getElementById('onboardingNext');function c(){b.disabled=!(state.org.name.length>0&&state.org.industry&&state.org.employees)}n.addEventListener('input',function(e){state.org.name=e.target.value;c()});s.addEventListener('change',function(e){state.org.employees=e.target.value;c()});d.addEventListener('input',function(e){state.org.description=e.target.value})}
function selectIndustry(id){state.org.industry=id;document.querySelectorAll('.industry-card').forEach(function(c){c.classList.remove('selected')});event.currentTarget.classList.add('selected');var b=document.getElementById('onboardingNext');if(b)b.disabled=!(state.org.name&&state.org.industry&&state.org.employees)}

function renderUpload(){return '<div class="step-panel active"><div class="step-header"><h1>Upload Your Data</h1><p>πX Universal Data Intelligence Engine will analyze your data and build an intelligence profile. Upload CSV, Excel, or PDF files — or use our sample dataset.</p></div><div class="upload-zone" id="uploadZone" onclick="triggerUpload()"><div class="uz-icon">📁</div><div class="uz-title">Drop files here or click to browse</div><div class="uz-sub">πX will profile every column, detect entities, identify KPIs, and build your ontology</div><div class="uz-formats">CSV · XLSX · PDF · JSON · DB connection</div></div><input type="file" id="fileInput" style="display:none" multiple accept=".csv,.xlsx,.xls,.pdf,.json" onchange="handleFiles(this.files)"><div class="file-list" id="fileList"></div><div style="margin-top:20px"><button class="btn btn-secondary" onclick="useSampleData()">Use sample '+(state.org.industry||'retail')+' dataset</button></div><div class="step-actions"><button class="btn btn-ghost" onclick="state.step=0;renderStep()">← Back</button><button class="btn btn-primary" id="uploadNext" onclick="completeUpload()" disabled>Analyze Data →</button></div></div>'}
function attachUpload(){var z=document.getElementById('uploadZone');z.addEventListener('dragover',function(e){e.preventDefault();z.classList.add('dragover')});z.addEventListener('dragleave',function(e){z.classList.remove('dragover')});z.addEventListener('drop',function(e){e.preventDefault();z.classList.remove('dragover');handleFiles(e.dataTransfer.files)})}
function triggerUpload(){document.getElementById('fileInput').click()}
function handleFiles(files){for(var i=0;i<files.length;i++){state.dataset.files.push({name:files[i].name,size:(files[i].size/1024).toFixed(1)+' KB',type:files[i].name.split('.').pop().toUpperCase()})}renderFileList();document.getElementById('uploadNext').disabled=state.dataset.files.length===0}

function renderFileList(){var l=document.getElementById('fileList');if(state.dataset.files.length===0){l.innerHTML='';return}l.innerHTML=state.dataset.files.map(function(f){return '<div class="file-item"><div class="fi-icon">'+f.type+'</div><div class="fi-info"><div class="fi-name">'+f.name+'</div><div class="fi-meta">'+f.type+' file — ready for analysis</div></div><div class="fi-size">'+f.size+'</div></div>'}).join('')}

function renderAnalysis(){return '<div class="step-panel active"><div class="step-header"><h1>Building Your Intelligence Profile</h1><p>πX is analyzing your data through the Universal Data Intelligence Engine. It will identify entities, KPIs, relationships, and build your organization\'s ontology.</p></div><div class="analysis-container" id="analysisContainer"><div class="analysis-stage" id="stage-0"><div class="as-icon">📊</div><div class="as-content"><div class="as-title">Profiling Dataset Columns</div><div class="as-sub">Analyzing '+state.dataset.files.length+' files, detecting entity types and metrics</div></div><div class="as-spinner"></div><div class="as-check">✓</div></div><div class="analysis-stage" id="stage-1"><div class="as-icon">🔗</div><div class="as-content"><div class="as-title">Semantic Mapping</div><div class="as-sub">Mapping columns to ontology entities using 6-layer mapping engine</div></div><div class="as-spinner"></div><div class="as-check">✓</div></div><div class="analysis-stage" id="stage-2"><div class="as-icon">📐</div><div class="as-content"><div class="as-title">KPI Detection</div><div class="as-sub">Identifying key performance indicators and their formulas</div></div><div class="as-spinner"></div><div class="as-check">✓</div></div><div class="analysis-stage" id="stage-3"><div class="as-icon">🕸️</div><div class="as-content"><div class="as-title">Relationship Discovery</div><div class="as-sub">Finding connections between entities, foreign keys, and correlations</div></div><div class="as-spinner"></div><div class="as-check">✓</div></div><div class="analysis-stage" id="stage-4"><div class="as-icon">🧠</div><div class="as-content"><div class="as-title">Profile Intelligence Agent</div><div class="as-sub">AI agent inferring industry, building ontology, creating intelligence profile</div></div><div class="as-spinner"></div><div class="as-check">✓</div></div><div class="analysis-stage" id="stage-5"><div class="as-icon">✨</div><div class="as-content"><div class="as-title">Profile Created</div><div class="as-sub">Intelligence profile with confidence scoring and versioning ready</div></div><div class="as-spinner"></div><div class="as-check">✓</div></div></div><div id="profileResult" style="display:none"></div></div>'}

function renderDashboard(){var ind=state.org.industry;var p=state.profile||PROFILES[ind]||PROFILES.retail;var kpis=p.kpis;var widgets=kpis.slice(0,6).map(function(kpi,i){var base=40+Math.random()*60;var data=genSparkData(base,base*0.15,12);var current=data[data.length-1];var prev=data[data.length-2]||current;var change=((current-prev)/prev*100).toFixed(1);var isUp=parseFloat(change)>=0;var types=['kpi_card','line_chart','bar_chart','kpi_card','line_chart','gauge'];return{kpi:kpi,data:data,current:current,change:change,isUp:isUp,type:types[i]}});return '<div class="step-panel active"><div class="step-header"><h1>Generated Dashboard — '+state.org.name+'</h1><p>This dashboard was generated by the πX Dynamic Dashboard Engine from your Intelligence Profile. No hardcoded widgets — every widget originates from your ontology and KPIs.</p></div><div style="display:flex;gap:8px;margin-bottom:16px"><button class="btn btn-secondary" style="font-size:12px;padding:6px 12px" onclick="switchRole(this)">CEO View</button><button class="btn btn-secondary" style="font-size:12px;padding:6px 12px" onclick="switchRole(this)">CFO View</button><button class="btn btn-secondary" style="font-size:12px;padding:6px 12px" onclick="switchRole(this)">Analyst View</button></div><div class="dash-grid" id="dashGrid">'+widgets.map(function(w,i){return '<div class="dash-widget '+(w.type==='line_chart'&&i<2?'span-2':'')+'"><div class="dw-header"><div class="dw-title">'+w.kpi.name+'</div><div class="dw-type">'+w.type+'</div></div><div class="dw-value">'+(w.kpi.target.indexOf('%')>=0?w.current.toFixed(1)+'%':w.kpi.target.indexOf('€')>=0?'€'+(w.current*1000).toFixed(0)+'K':w.current.toFixed(0))+'</div><div class="dw-change '+(w.isUp?'up':'down')+'">'+(w.isUp?'↑':'↓')+' '+Math.abs(parseFloat(w.change))+'% vs last period</div><div class="dw-chart">'+w.data.map(function(v,j){var max=Math.max.apply(null,w.data);var h=(v/max*100);return '<div class="dw-bar '+(j===w.data.length-1?'active':'')+'" style="height:'+h+'%"></div>'}).join('')+'</div></div>'}).join('')+'<div class="dash-widget span-2"><div class="dw-header"><div class="dw-title">Agent Activity</div><div class="dw-type">live_feed</div></div><div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">'+p.agents.slice(0,4).map(function(a,i){return '<div style="display:flex;align-items:center;gap:10px;padding:6px 0"><div style="width:28px;height:28px;border-radius:6px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-size:14px">'+a.icon+'</div><div style="flex:1"><div style="font-size:12px;font-weight:500">'+a.label+'</div><div style="font-size:10px;color:var(--text-3);font-family:var(--mono)">monitoring '+a.kpis.join(', ')+'</div></div><div style="font-size:10px;color:var(--success);display:flex;align-items:center;gap:4px"><div style="width:5px;height:5px;border-radius:50%;background:var(--success);box-shadow:0 0 6px rgba(16,185,129,0.4)"></div>active</div></div>'}).join('')+'</div></div></div><div class="step-actions"><button class="btn btn-ghost" onclick="state.step=2;renderStep()">← Back</button><button class="btn btn-primary" onclick="state.step=4;renderStep()">Activate Agents →</button></div></div>'}
function switchRole(btn){document.querySelectorAll('.btn-secondary').forEach(function(b){b.style.borderColor='var(--border)'});btn.style.borderColor='var(--accent)'}
function renderAgents(){var ind=state.org.industry;var p=state.profile||PROFILES[ind]||PROFILES.retail;return '<div class="step-panel active"><div class="step-header"><h1>AI Agent Activation</h1><p>πX created '+p.agents.length+' AI agents from your Intelligence Profile. Each agent is industry-aware, data-aware, and goal-driven. Click an agent to activate it.</p></div><div class="agent-grid" id="agentGrid">'+p.agents.map(function(a,i){return '<div class="agent-card '+(state.agents.includes(i)?'active':'')+'" onclick="toggleAgent('+i+')"><div class="ag-header"><div class="ag-icon">'+a.icon+'</div><div><div class="ag-name">'+a.label+'</div><div class="ag-type">'+a.type+'</div></div></div><div class="ag-purpose">'+a.purpose+'</div><div class="ag-kpis">'+a.kpis.map(function(k){return '<div class="ag-kpi">'+k+'</div>'}).join('')+'</div><div class="ag-status"><div class="ag-dot"></div><span>'+(state.agents.includes(i)?'Active — monitoring KPIs':'Click to activate')+'</span></div></div>'}).join('')+'</div><div class="step-actions"><button class="btn btn-ghost" onclick="state.step=3;renderStep()">← Back</button><button class="btn btn-primary" id="agentsNext" onclick="state.step=5;renderStep()" '+(state.agents.length===0?'disabled':'')+'>Open Intelligence Interface →</button></div></div>'}
function attachAgents(){if(state.agents.length===0){var ind=state.org.industry;var p=state.profile||PROFILES[ind]||PROFILES.retail;p.agents.forEach(function(_,i){setTimeout(function(){if(!state.agents.includes(i))state.agents.push(i);renderAgents();attachAgents();document.getElementById('agentsNext').disabled=state.agents.length===0},300+i*400)})}}
function toggleAgent(i){var idx=state.agents.indexOf(i);if(idx>=0)state.agents.splice(idx,1);else state.agents.push(i);renderAgents();attachAgents();document.getElementById('agentsNext').disabled=state.agents.length===0}
function renderChat(){var ind=state.org.industry;var p=state.profile||PROFILES[ind]||PROFILES.retail;var aa=state.agents.map(function(i){return p.agents[i].label});var suggestions=['Why did '+p.kpis[0].name.toLowerCase()+' drop last quarter?','Forecast '+p.kpis[0].name.toLowerCase()+' for next month','Compare '+p.kpis[0].name.toLowerCase()+' vs '+p.kpis[1].name.toLowerCase(),"What's driving "+p.kpis[1].name.toLowerCase()+'?'];if(state.chatHistory.length===0){state.chatHistory.push({type:'agent',meta:'πX Intelligence',text:'I\'ve activated '+aa.length+' agents: '+aa.join(', ')+'. I can analyze your '+p.kpis.length+' KPIs across '+p.entities.length+' entity types. Ask me anything about your business.'})}return '<div class="step-panel active"><div class="step-header"><h1>Natural Language Intelligence</h1><p>Ask a business question in plain language. πX understands intent, identifies KPIs, retrieves memory, activates agents, and generates a decision with confidence scoring.</p></div><div class="chat-container"><div class="chat-suggestions" id="chatSuggestions">'+suggestions.map(function(s){return '<div class="chat-suggestion" onclick="askQuestion(\''+s.replace(/'/g,"\\'")+'\')">'+s+'</div>'}).join('')+'</div><div class="chat-messages" id="chatMessages">'+state.chatHistory.map(renderMessage).join('')+'</div><div class="chat-input"><input type="text" id="chatInput" placeholder="Ask πX about your business…" onkeydown="if(event.key===\'Enter\')sendMessage()"><button class="send-btn" id="sendBtn" onclick="sendMessage()">→</button></div></div></div>'}
function attachChat(){document.getElementById('chatInput').focus()}
function renderMessage(m){if(m.type==='user')return '<div class="chat-msg user"><div class="msg-bubble">'+m.text+'</div></div>';var html='<div class="chat-msg agent"><div class="msg-bubble">';if(m.intent){html+='<div class="intent-analysis"><div class="ia-label">Intent Analysis</div><div class="ia-tags"><span class="intent-tag accent">intent: '+m.intent+'</span>'+(m.kpis?m.kpis.map(function(k){return '<span class="intent-tag">kpi: '+k+'</span>'}).join(''):'')+(m.entities?m.entities.map(function(e){return '<span class="intent-tag">entity: '+e+'</span>'}).join(''):'')+(m.agents?m.agents.map(function(a){return '<span class="intent-tag">agent: '+a+'</span>'}).join(''):'')+'</div></div>'}html+=m.text;if(m.decision){html+='<div class="msg-decision"><div class="msg-decision-title">📋 Decision</div><div style="font-size:13px;color:var(--text-2);margin-bottom:6px">'+m.decision+'</div><div class="msg-confidence">Confidence: '+m.confidence+'% <div class="confidence-bar"><div class="cb-fill" style="width:'+m.confidence+'%"></div></div></div></div>'}html+='</div><div class="msg-meta">'+m.meta+'</div></div>';return html}
function sendMessage(){var input=document.getElementById('chatInput');var text=input.value.trim();if(!text)return;input.value='';askQuestion(text)}
function askQuestion(text){var ind=state.org.industry;var p=state.profile||PROFILES[ind]||PROFILES.retail;var aa=state.agents.map(function(i){return p.agents[i]});state.chatHistory.push({type:'user',text:text});document.getElementById('chatMessages').innerHTML=state.chatHistory.map(renderMessage).join('');document.getElementById('chatSuggestions').style.display='none';var t=document.createElement('div');t.id='typingIndicator';t.innerHTML='<div class="chat-msg agent"><div class="msg-bubble"><div class="chat-typing"><span></span><span></span><span></span></div></div></div>';document.getElementById('chatMessages').appendChild(t);t.scrollIntoView({behavior:'smooth'});setTimeout(function(){t.remove();var r=processNLQuery(text,p,aa);state.chatHistory.push(r);document.getElementById('chatMessages').innerHTML=state.chatHistory.map(renderMessage).join('');document.getElementById('chatMessages').scrollTo({top:999999,behavior:'smooth'});checkDemoComplete()},1500+Math.random()*1000)}
var INTENT_PATTERNS={root_cause:['why did','what caused','reason for','why is','why was'],prediction:['forecast','predict','what will','expected','projected'],comparison:['compare','difference between','vs','versus','better'],summary:['summarize','overview','status of','how is','what is the state'],recommendation:['recommend','should','what should','best approach','advice'],trend:['trend','over time','historical','pattern','trajectory'],anomaly:['anomaly','unusual','unexpected','outlier','strange']};
function processNLQuery(query,profile,agents){var q=query.toLowerCase();var intent='general_inquiry';for(var type in INTENT_PATTERNS){if(INTENT_PATTERNS[type].some(function(p){return q.indexOf(p)>=0})){intent=type;break}}var intentLabel=intent.replace(/_/g,' ');var identifiedKpis=profile.kpis.filter(function(k){var kl=k.name.toLowerCase();var fl=k.formula.toLowerCase();return q.indexOf(kl)>=0||k.name.toLowerCase().split(' ').some(function(w){return w.length>3&&q.indexOf(w)>=0})||fl.split(' ').some(function(w){return w.length>3&&q.indexOf(w)>=0})}).map(function(k){return k.name});if(identifiedKpis.length===0)identifiedKpis.push(profile.kpis[0].name);var identifiedEntities=profile.entities.filter(function(e){return q.indexOf(e.type.toLowerCase())>=0}).map(function(e){return e.type});var activatedAgents=agents.filter(function(a){return a.kpis.some(function(k){return identifiedKpis.some(function(qk){return k.toLowerCase().indexOf(qk.toLowerCase())>=0||qk.toLowerCase().indexOf(k.toLowerCase())>=0})})});var agentNames=(activatedAgents.length>0?activatedAgents:agents.slice(0,3)).map(function(a){return a.label});var response='Based on analysis from '+agentNames.length+' agent(s)';if(intent==='root_cause'){response+=', the primary cause has been identified through multi-agent investigation.\n\n';var causes=['A 15% decline was observed in the primary metric, driven by market entry of a new competitor in the German market segment.','The drop correlates with a supply chain disruption in Q3 that affected 23% of active orders.','Analysis shows a seasonal pattern combined with a one-time pricing adjustment that reduced average order value.'];response+=causes[Math.floor(Math.random()*causes.length)]}else if(intent==='prediction'){response+=', here is the forecast:\n\n';response+='Based on historical patterns and current signals, '+identifiedKpis[0]+' is projected to '+(Math.random()>0.5?'increase':'decrease')+' by '+(Math.random()*15+2).toFixed(1)+'% in the next period. The model accounts for seasonality, market trends, and operational capacity.'}else if(intent==='comparison'){response+=', here is the comparison:\n\n';response+=identifiedKpis[0]+' shows stronger performance with '+(Math.random()*20+60).toFixed(0)+'% efficiency, while '+(identifiedKpis[1]||'the other metric')+' operates at '+(Math.random()*20+40).toFixed(0)+'%. The gap is primarily driven by resource allocation differences.'}else{response+=':\n\nCurrent status across all monitored KPIs is within expected ranges. '+identifiedKpis[0]+' is trending '+(Math.random()>0.5?'upward':'downward')+'. All '+agents.length+' agents are active and monitoring.'}var decision='';if(intent==='root_cause')decision='Primary cause identified: market dynamics in the German segment. Recommend increasing marketing spend by 20% and optimizing pricing strategy for affected product categories.';else if(intent==='prediction')decision='Forecast model suggests maintaining current operational levels. Monitor the identified trend weekly and adjust resource allocation if variance exceeds 5%.';else if(intent==='comparison')decision='Reallocate 15% of resources from the underperforming metric to the higher-performing area. Expected net improvement: 8-12%.';else decision='All systems operating normally. Continue monitoring. Next scheduled intelligence check in 15 minutes.';var confidence=Math.round(65+agentNames.length*5+Math.random()*15);return{type:'agent',meta:agentNames.join(' + ')+' · '+intentLabel+' · '+(Math.random()*300+200).toFixed(0)+'ms',text:response,intent:intentLabel,kpis:identifiedKpis.slice(0,3),entities:identifiedEntities.slice(0,2),agents:agentNames.slice(0,3),decision:decision,confidence:confidence}}
function checkDemoComplete(){if(state.step===5&&state.chatHistory.filter(function(m){return m.type==='user'}).length>=2){var e=document.getElementById('demoComplete');if(!e){var d=document.createElement('div');d.id='demoComplete';d.className='demo-complete';d.innerHTML='<div class="dc-icon">✓</div><h2>Demo Flow Complete</h2><p>πX is now running autonomously — detecting changes, analyzing data, creating decisions, and updating company memory.</p><div class="dc-stats"><div class="dc-stat"><div class="ds-value">'+(state.profile?state.profile.entities.length:0)+'</div><div class="ds-label">Entities</div></div><div class="dc-stat"><div class="ds-value">'+(state.profile?state.profile.kpis.length:0)+'</div><div class="ds-label">KPIs</div></div><div class="dc-stat"><div class="ds-value">'+state.agents.length+'</div><div class="ds-label">Active Agents</div></div></div><button class="btn btn-secondary" onclick="resetDemo()">Start Over</button>';document.querySelector('.chat-container').appendChild(d)}}}
function resetDemo(){state.step=0;state.org={name:'',industry:'',employees:'',description:''};state.dataset={files:[],uploaded:false};state.profile=null;state.dashboard=null;state.agents=[];state.chatHistory=[];document.getElementById('orgBadge').style.display='none';renderStep()}
renderStep();
</script>
